<svg viewBox="0 0 1600 220" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050807"/>
      <stop offset="100%" stop-color="#081008"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#adff2f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#adff2f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="220" fill="url(#spBg)"/>

  <!-- starfield -->
  <g fill="#c9ffb0" opacity="0.4">
    <circle cx="40" cy="30" r="1.3"/><circle cx="130" cy="80" r="1"/><circle cx="260" cy="20" r="1.2"/>
    <circle cx="410" cy="60" r="1"/><circle cx="560" cy="15" r="1.3"/><circle cx="720" cy="70" r="1"/>
    <circle cx="880" cy="25" r="1.2"/><circle cx="1030" cy="55" r="1"/><circle cx="1190" cy="18" r="1.3"/>
    <circle cx="1340" cy="65" r="1"/><circle cx="1500" cy="30" r="1.2"/><circle cx="90" cy="160" r="1"/>
    <circle cx="300" cy="190" r="1.2"/><circle cx="600" cy="170" r="1"/><circle cx="950" cy="185" r="1.3"/>
    <circle cx="1250" cy="165" r="1"/><circle cx="1470" cy="180" r="1.2"/>
  </g>

  <!-- commit trail: squares left behind, like a contribution graph strip -->
  <g id="trail">
    <!-- shade approximates commit intensity, static baseline row -->
    <g id="row" fill="#173a1a">
      <rect x="40"  y="110" width="14" height="14" rx="3"/>
      <rect x="64"  y="110" width="14" height="14" rx="3" fill="#2a5c22"/>
      <rect x="88"  y="110" width="14" height="14" rx="3" fill="#1d4a1d"/>
      <rect x="112" y="110" width="14" height="14" rx="3" fill="#3d7a28"/>
      <rect x="136" y="110" width="14" height="14" rx="3"/>
      <rect x="160" y="110" width="14" height="14" rx="3" fill="#2a5c22"/>
      <rect x="184" y="110" width="14" height="14" rx="3" fill="#4f9c2e"/>
      <rect x="208" y="110" width="14" height="14" rx="3" fill="#1d4a1d"/>
      <rect x="232" y="110" width="14" height="14" rx="3" fill="#3d7a28"/>
      <rect x="256" y="110" width="14" height="14" rx="3"/>
      <rect x="280" y="110" width="14" height="14" rx="3" fill="#2a5c22"/>
      <rect x="304" y="110" width="14" height="14" rx="3" fill="#6bd83a"/>
      <rect x="328" y="110" width="14" height="14" rx="3" fill="#1d4a1d"/>
      <rect x="352" y="110" width="14" height="14" rx="3" fill="#3d7a28"/>
    </g>
    <!-- the strip repeats across the width -->
    <use href="#row" x="336"/>
    <use href="#row" x="672"/>
    <use href="#row" x="1008"/>
    <use href="#row" x="1344"/>
  </g>

  <!-- the rocket: travels the width, looping, lighting each square it passes -->
  <g id="ship">
    <animateMotion path="M -60,0 L 1660,0" dur="9s" repeatCount="indefinite"/>
    <g transform="translate(0,117)">
      <path d="M0 0 l 34 -6 l 10 6 l -10 6 z" fill="#eafcd8"/>
      <path d="M0 0 l -22 -4 l 0 8 z" fill="url(#flame)"/>
      <circle cx="26" cy="0" r="3" fill="#0a1206"/>
    </g>
  </g>

  <text x="60" y="60" font-size="20" font-weight="700" fill="#e9ffd0">Shipping commits, one orbit at a time</text>
  <text x="60" y="84" font-size="14" fill="#7fae52">github.com/aryanroy666</text>
</svg>
