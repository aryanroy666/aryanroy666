<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e151b"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="900" height="330" rx="14"/></clipPath>

    <clipPath id="clip0"><rect id="r0" x="30" y="64" width="0" height="20" fill="#fff"><animate id="a0" attributeName="width" from="0" to="340" begin="0.2s" dur="1.6s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="clip1"><rect id="r1" x="30" y="102" width="0" height="20" fill="#fff"><animate id="a1" attributeName="width" from="0" to="265" begin="a0.end+0.15s" dur="1.24s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="clip2"><rect id="r2" x="30" y="140" width="0" height="20" fill="#fff"><animate id="a2" attributeName="width" from="0" to="430" begin="a1.end+0.15s" dur="2.0s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="clip3"><rect id="r3" x="30" y="178" width="0" height="20" fill="#fff"><animate id="a3" attributeName="width" from="0" to="400" begin="a2.end+0.15s" dur="1.9s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="clip4"><rect id="r4" x="30" y="216" width="0" height="20" fill="#fff"><animate id="a4" attributeName="width" from="0" to="430" begin="a3.end+0.15s" dur="2.0s" fill="freeze" calcMode="linear"/></rect></clipPath>
    <clipPath id="clip5"><rect id="r5" x="30" y="262" width="0" height="20" fill="#fff"><animate id="a5" attributeName="width" from="0" to="230" begin="a4.end+0.15s" dur="1.1s" fill="freeze" calcMode="linear"/></rect></clipPath>

    <filter id="barGlow" x="-60%" y="-300%" width="220%" height="700%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="330" rx="14" fill="url(#bg)"/>

  <g clip-path="url(#clip)">
    <!-- ambient glow pulse -->
    <rect x="0" y="0" width="900" height="330" rx="14" fill="none" stroke="#7ee83a" stroke-width="6" opacity="0.12">
      <animate attributeName="opacity" values="0.06;0.22;0.06" dur="3.2s" repeatCount="indefinite"/>
    </rect>

    <!-- scanline sweep -->
    <rect x="0" y="-60" width="900" height="60" fill="#7ee83a" opacity="0.06">
      <animate attributeName="y" values="-60;330" dur="5s" repeatCount="indefinite"/>
    </rect>

    <text x="30" y="34" font-size="12" fill="#4a5560" letter-spacing="0.5">aryan-roy@github — zsh — ~/about-me</text>

    <!-- boot lines, each revealed via a growing clip mask (true typewriter effect) -->
    <g font-size="14" fill="#c9d1d9">
      <g clip-path="url(#clip0)">
        <text x="30" y="80"><tspan fill="#3a4550">[INIT] </tspan>booting profile://aryan-roy ...</text>
      </g>
      <g clip-path="url(#clip1)">
        <text x="30" y="118"><tspan fill="#3a4550">[OK] </tspan>role       : Data Analyst</text>
      </g>
      <g clip-path="url(#clip2)">
        <text x="30" y="156"><tspan fill="#3a4550">[OK] </tspan>building   : multi-agent GenAI + RAG systems</text>
      </g>
      <g clip-path="url(#clip3)">
        <text x="30" y="194"><tspan fill="#3a4550">[OK] </tspan>off_duty   : state-level MMA, black belt</text>
      </g>
      <g clip-path="url(#clip4)">
        <text x="30" y="232"><tspan fill="#3a4550">[OK] </tspan>mission    : QA rigor + GenAI shipping speed</text>
      </g>
      <g clip-path="url(#clip5)">
        <text x="30" y="278">&gt; status: <tspan fill="#7ee83a" font-weight="bold">EVOLVING_WITH_AI</tspan></text>
      </g>
    </g>

    <!-- typing cursor: rides along each line as it types, then blinks at rest -->
    <rect id="cursor" x="30" y="67" width="8" height="15" fill="#7ee83a">
      <set attributeName="y" to="67"  begin="0.2s"/>
      <set attributeName="y" to="105" begin="a0.end+0.15s"/>
      <set attributeName="y" to="143" begin="a1.end+0.15s"/>
      <set attributeName="y" to="181" begin="a2.end+0.15s"/>
      <set attributeName="y" to="219" begin="a3.end+0.15s"/>
      <set attributeName="y" to="265" begin="a4.end+0.15s"/>

      <animate attributeName="x" begin="0.2s"           dur="1.6s"  from="30" to="370" fill="freeze" calcMode="linear"/>
      <animate attributeName="x" begin="a0.end+0.15s"    dur="1.24s" from="30" to="295" fill="freeze" calcMode="linear"/>
      <animate attributeName="x" begin="a1.end+0.15s"    dur="2.0s"  from="30" to="460" fill="freeze" calcMode="linear"/>
      <animate attributeName="x" begin="a2.end+0.15s"    dur="1.9s"  from="30" to="430" fill="freeze" calcMode="linear"/>
      <animate attributeName="x" begin="a3.end+0.15s"    dur="2.0s"  from="30" to="460" fill="freeze" calcMode="linear"/>
      <animate attributeName="x" begin="a4.end+0.15s"    dur="1.1s"  from="30" to="260" fill="freeze" calcMode="linear"/>

      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.001;0.001;0.999;0.999" begin="0.2s" dur="1.6s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" begin="a5.end+0.15s" dur="0.01s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="a5.end+0.15s" repeatCount="indefinite"/>
    </rect>

    <!-- skill bars: precise track (380px = 100%), load strictly one after another, each glowing -->
    <g font-size="12" fill="#c9d1d9">
      <text x="470" y="76">DATA ANALYSIS</text>
      <text x="850" y="76" text-anchor="end">99%</text>
      <rect x="470" y="84" width="380" height="7" rx="3.5" fill="#1b232c"/>
      <rect x="470" y="84" width="0" height="7" rx="3.5" fill="#7ee83a" filter="url(#barGlow)">
        <animate id="bar1" attributeName="width" from="0" to="376.2" begin="0.4s" dur="1.0s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        <animate attributeName="opacity" values="1;0.72;1" dur="2.4s" begin="bar1.end" repeatCount="indefinite"/>
      </rect>

      <text x="470" y="118">GENAI ENGINEERING</text>
      <text x="850" y="118" text-anchor="end">96%</text>
      <rect x="470" y="126" width="380" height="7" rx="3.5" fill="#1b232c"/>
      <rect x="470" y="126" width="0" height="7" rx="3.5" fill="#4ac0ff" filter="url(#barGlow)">
        <animate id="bar2" attributeName="width" from="0" to="364.8" begin="bar1.end+0.12s" dur="1.0s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        <animate attributeName="opacity" values="1;0.72;1" dur="2.6s" begin="bar2.end" repeatCount="indefinite"/>
      </rect>

      <text x="470" y="160">PROBLEM SOLVING</text>
      <text x="850" y="160" text-anchor="end">100%</text>
      <rect x="470" y="168" width="380" height="7" rx="3.5" fill="#1b232c"/>
      <rect x="470" y="168" width="0" height="7" rx="3.5" fill="#ffb84a" filter="url(#barGlow)">
        <animate id="bar3" attributeName="width" from="0" to="380" begin="bar2.end+0.12s" dur="1.0s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        <animate attributeName="opacity" values="1;0.72;1" dur="2.3s" begin="bar3.end" repeatCount="indefinite"/>
      </rect>

      <text x="470" y="202">PRECISION &amp; RIGOR</text>
      <text x="850" y="202" text-anchor="end">97%</text>
      <rect x="470" y="210" width="380" height="7" rx="3.5" fill="#1b232c"/>
      <rect x="470" y="210" width="0" height="7" rx="3.5" fill="#ff6a6a" filter="url(#barGlow)">
        <animate id="bar4" attributeName="width" from="0" to="368.6" begin="bar3.end+0.12s" dur="1.0s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        <animate attributeName="opacity" values="1;0.72;1" dur="2.5s" begin="bar4.end" repeatCount="indefinite"/>
      </rect>

      <text x="470" y="244">LEADERSHIP</text>
      <text x="850" y="244" text-anchor="end">100%</text>
      <rect x="470" y="252" width="380" height="7" rx="3.5" fill="#1b232c"/>
      <rect x="470" y="252" width="0" height="7" rx="3.5" fill="#c98bff" filter="url(#barGlow)">
        <animate id="bar5" attributeName="width" from="0" to="380" begin="bar4.end+0.12s" dur="1.0s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        <animate attributeName="opacity" values="1;0.72;1" dur="2.7s" begin="bar5.end" repeatCount="indefinite"/>
      </rect>

      <text x="470" y="286">ADAPTABILITY</text>
      <text x="850" y="286" text-anchor="end">94%</text>
      <rect x="470" y="294" width="380" height="7" rx="3.5" fill="#1b232c"/>
      <rect x="470" y="294" width="0" height="7" rx="3.5" fill="#3ae8c4" filter="url(#barGlow)">
        <animate id="bar6" attributeName="width" from="0" to="357.2" begin="bar5.end+0.12s" dur="1.0s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        <animate attributeName="opacity" values="1;0.72;1" dur="2.2s" begin="bar6.end" repeatCount="indefinite"/>
      </rect>
    </g>

  </g>
</svg>
